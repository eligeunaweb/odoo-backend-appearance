services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: local-test-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  odoo:
    image: odoo:15.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: local-test-only
    volumes:
      - .:/mnt/extra-addons:ro
      - odoo_data:/var/lib/odoo
    ports:
      - "127.0.0.1:18119:8069"

volumes:
  odoo_data:
