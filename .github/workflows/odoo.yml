name: Odoo 19
on: [push, pull_request]
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and test
        run: docker compose -f compose.test.yml run --rm odoo odoo -d appearance_ci -i euw_backend_appearance --test-enable --test-tags /euw_backend_appearance --stop-after-init
      - name: Install business apps
        run: docker compose -f compose.test.yml run --rm odoo odoo -d appearance_ci -i contacts,sale_management,stock --stop-after-init
      - name: Update and test with business apps installed
        run: docker compose -f compose.test.yml run --rm odoo odoo -d appearance_ci -u euw_backend_appearance --test-enable --test-tags /euw_backend_appearance --stop-after-init
      - name: Check compiled assets after recreating Odoo
        run: |
          docker compose -f compose.test.yml run --rm -d --service-ports --name appearance-ci-web odoo odoo -d appearance_ci
          python scripts/check_test_assets.py appearance_ci
          docker stop appearance-ci-web
          docker compose -f compose.test.yml run --rm -d --service-ports --name appearance-ci-web-recreated odoo odoo -d appearance_ci
          python scripts/check_test_assets.py appearance_ci
      - name: Remove test containers
        if: always()
        run: docker compose -f compose.test.yml down -v --remove-orphans
