name: Odoo 19
on: [push, pull_request]
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and test
        run: docker compose -f compose.test.yml run --rm odoo odoo -d appearance_ci -i backend_appearance --test-enable --test-tags /backend_appearance --stop-after-init
      - name: Update
        run: docker compose -f compose.test.yml run --rm odoo odoo -d appearance_ci -u backend_appearance --stop-after-init
      - name: Remove test containers
        if: always()
        run: docker compose -f compose.test.yml down -v
